<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Learning Platform</title>

    <link rel="stylesheet" href="home.css">

    <!-- JavaScript -->
    <script src="h.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Welcome to my learning platform!</h1>
    </header>


    <!-- NAVIGATION -->
    <nav class="main-nav">

        <div class="logo">
            MyWebsite
        </div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>


    <!-- LOGIN SECTION -->
    <div class="login-container">

        <div class="login-box">

            <h2>Login</h2>

            <form id="loginForm">

                <div class="input-box">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="input-box">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="button" onclick="login()">
                    Login
                </button>


                <p>
                    Don't have an account?
                    <a href="register.html">Register</a>
                </p>

            </form>

        </div>

    </div>


    <!-- LATEST UPDATES -->
    <div class="info-container">

        <div class="info-box">

            <div class="label-box">

                <h2>
                    Latest Updates
                </h2>

            </div>

            <p>
                Check out the latest updates and news
                related to our platform.
            </p>


            <nav class="info-nav">

                <ul>

                    <li>
                        <a href="#">Update 1</a>
                    </li>

                    <li>
                        <a href="#">Update 2</a>
                    </li>

                    <li>
                        <a href="#">Update 3</a>
                    </li>

                </ul>

            </nav>

        </div>

    </div>


</body>

</html>
